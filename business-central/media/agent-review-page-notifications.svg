<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="597" viewBox="0 80 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Show and hide page notifications during agent review</title>
  <desc id="desc">Two Business Central page views compare page notifications hidden behind the data review bar with the notifications shown below the bar.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
    <style>
      .ui { font-family: "Segoe UI", Arial, sans-serif; fill: #242424; }
      .label { font: 600 19px "Segoe UI", Arial, sans-serif; fill: #323130; }
      .small { font: 14px "Segoe UI", Arial, sans-serif; }
      .body { font: 16px "Segoe UI", Arial, sans-serif; }
      .semibold { font-weight: 600; }
      .link { fill: #006cbe; text-decoration: underline; }
      .muted { fill: #605e5c; }
      .white { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1200" height="780" fill="#f3f2f1"/>

  <!-- Hidden state -->
  <text x="40" y="112" class="label">Notifications hidden</text>
  <g filter="url(#shadow)">
    <rect x="40" y="128" width="1120" height="232" rx="4" fill="#ffffff"/>
    <rect x="40" y="128" width="1120" height="42" rx="4" fill="#242424"/>
    <rect x="40" y="166" width="1120" height="4" fill="#242424"/>
    <rect x="58" y="140" width="18" height="18" rx="2" fill="#00b7c3"/>
    <path d="M63 149h8M67 145v8" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <text x="89" y="156" class="ui white" font-size="17" font-weight="600">Dynamics 365 Business Central</text>
    <circle cx="1119" cy="149" r="10" fill="#616161"/>
    <text x="1114" y="154" class="ui white small semibold">A</text>

    <text x="68" y="202" class="ui" font-size="23" font-weight="600">Sales Order</text>
    <text x="68" y="229" class="ui muted small">Order 101009 - Adatum Corporation</text>

    <rect x="60" y="246" width="1080" height="58" rx="3" fill="#dff4f5" stroke="#9edfe3"/>
    <circle cx="88" cy="275" r="17" fill="#00747f"/>
    <text x="78" y="281" class="ui white small semibold">SO</text>
    <text x="118" y="270" class="ui body semibold">Sales Order Agent awaits review:</text>
    <text x="369" y="270" class="ui body">The agent made updates as part of a task.</text>
    <text x="118" y="291" class="ui small link">Review agent task</text>
    <text x="243" y="291" class="ui small muted">|</text>
    <text x="259" y="291" class="ui small link">Show other notifications (2)</text>
    <rect x="934" y="258" width="118" height="34" rx="3" fill="#00747f"/>
    <text x="947" y="280" class="ui white small semibold">Review (3)</text>
    <path d="M1027 258v34" stroke="#ffffff" stroke-opacity="0.55"/>
    <path d="M15.85 7.65c.2.2.2.5 0 .7l-5.46 5.49a.55.55 0 0 1-.78 0L4.15 8.35a.5.5 0 1 1 .7-.7L10 12.8l5.15-5.16c.2-.2.5-.2.7 0Z" fill="#ffffff" transform="translate(1031 265) scale(0.7)"/>
    <path d="m4.09 4.22.06-.07a.5.5 0 0 1 .63-.06l.07.06L10 9.29l5.15-5.14a.5.5 0 0 1 .63-.06l.07.06c.18.17.2.44.06.63l-.06.07L10.71 10l5.14 5.15c.18.17.2.44.06.63l-.06.07a.5.5 0 0 1-.63.06l-.07-.06L10 10.71l-5.15 5.14a.5.5 0 0 1-.63.06l-.07-.06a.5.5 0 0 1-.06-.63l.06-.07L9.29 10 4.15 4.85a.5.5 0 0 1-.06-.63l.06-.07-.06.07Z" fill="#323130" transform="translate(1096 265)"/>

    <rect x="68" y="324" width="160" height="8" rx="4" fill="#c8c6c4"/>
    <rect x="68" y="342" width="275" height="7" rx="3.5" fill="#e1dfdd"/>
    <rect x="400" y="324" width="126" height="8" rx="4" fill="#c8c6c4"/>
    <rect x="400" y="342" width="220" height="7" rx="3.5" fill="#e1dfdd"/>
    <rect x="680" y="324" width="144" height="8" rx="4" fill="#c8c6c4"/>
    <rect x="680" y="342" width="250" height="7" rx="3.5" fill="#e1dfdd"/>
  </g>

