    <rect x="40" y="423" width="1120" height="42" rx="4" fill="#242424"/>
    <rect x="40" y="461" width="1120" height="4" fill="#242424"/>
    <rect x="58" y="435" width="18" height="18" rx="2" fill="#00b7c3"/>
    <path d="M63 444h8M67 440v8" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <text x="89" y="451" class="ui white" font-size="17" font-weight="600">Dynamics 365 Business Central</text>
    <circle cx="1119" cy="444" r="10" fill="#616161"/>
    <text x="1114" y="449" class="ui white small semibold">A</text>

    <text x="68" y="497" class="ui" font-size="23" font-weight="600">Sales Order</text>
    <text x="68" y="524" class="ui muted small">Order 101009 - Adatum Corporation</text>

    <rect x="60" y="541" width="1080" height="58" rx="3" fill="#dff4f5" stroke="#9edfe3"/>
    <circle cx="88" cy="570" r="17" fill="#00747f"/>
    <text x="78" y="576" class="ui white small semibold">SO</text>
    <text x="118" y="565" class="ui body semibold">Sales Order Agent awaits review:</text>
    <text x="369" y="565" class="ui body">The agent made updates as part of a task.</text>
    <text x="118" y="586" class="ui small link">Review agent task</text>
    <text x="243" y="586" class="ui small muted">|</text>
    <text x="259" y="586" class="ui small link">Hide other notifications (2)</text>
    <rect x="934" y="553" width="118" height="34" rx="3" fill="#00747f"/>
    <text x="947" y="575" class="ui white small semibold">Review (3)</text>
    <path d="M1027 553v34" stroke="#ffffff" stroke-opacity="0.55"/>
    <path d="M15.85 7.65c.2.2.2.5 0 .7l-5.46 5.49a.55.55 0 0 1-.78 0L4.15 8.35a.5.5 0 1 1 .7-.7L10 12.8l5.15-5.16c.2-.2.5-.2.7 0Z" fill="#ffffff" transform="translate(1031 560) scale(0.7)"/>
    <path d="m4.09 4.22.06-.07a.5.5 0 0 1 .63-.06l.07.06L10 9.29l5.15-5.14a.5.5 0 0 1 .63-.06l.07.06c.18.17.2.44.06.63l-.06.07L10.71 10l5.14 5.15c.18.17.2.44.06.63l-.06.07a.5.5 0 0 1-.63.06l-.07-.06L10 10.71l-5.15 5.14a.5.5 0 0 1-.63.06l-.07-.06a.5.5 0 0 1-.06-.63l.06-.07L9.29 10 4.15 4.85a.5.5 0 0 1-.06-.63l.06-.07-.06.07Z" fill="#323130" transform="translate(1096 560)"/>

    <rect x="60" y="605" width="1080" height="32" rx="2" fill="#f0f6ff" stroke="#c7e0f4"/>
    <path d="M15.85 7.65c.2.2.2.5 0 .7l-5.46 5.49a.55.55 0 0 1-.78 0L4.15 8.35a.5.5 0 1 1 .7-.7L10 12.8l5.15-5.16c.2-.2.5-.2.7 0Z" fill="#323130" transform="translate(73 611)"/>
    <text x="99" y="626" class="ui small semibold">Notifications</text>
    <text x="190" y="626" class="ui small semibold">2</text>

    <rect x="60" y="641" width="1080" height="35" rx="2" fill="#f0f6ff" stroke="#c7e0f4"/>
    <path d="M18 10a8 8 0 1 0-16 0 8 8 0 0 0 16 0ZM9.5 8.91a.5.5 0 0 1 1 0V13.6a.5.5 0 0 1-1 0V8.9Zm-.25-2.16a.75.75 0 1 1 1.5 0 .75.75 0 0 1-1.5 0Z" fill="#0f6cbd" transform="translate(71 648)"/>
    <text x="99" y="663" class="ui small">Your work date differs from today.</text>
    <text x="349" y="663" class="ui small muted">|</text>
    <text x="365" y="663" class="ui small link">Change work date</text>
    <path d="m4.09 4.22.06-.07a.5.5 0 0 1 .63-.06l.07.06L10 9.29l5.15-5.14a.5.5 0 0 1 .63-.06l.07.06c.18.17.2.44.06.63l-.06.07L10.71 10l5.14 5.15c.18.17.2.44.06.63l-.06.07a.5.5 0 0 1-.63.06l-.07-.06L10 10.71l-5.15 5.14a.5.5 0 0 1-.63.06l-.07-.06a.5.5 0 0 1-.06-.63l.06-.07L9.29 10 4.15 4.85a.5.5 0 0 1-.06-.63l.06-.07-.06.07Z" fill="#323130" transform="translate(1096 648)"/>

    <rect x="60" y="680" width="1080" height="35" rx="2" fill="#f0f6ff" stroke="#c7e0f4"/>
    <path d="M18 10a8 8 0 1 0-16 0 8 8 0 0 0 16 0ZM9.5 8.91a.5.5 0 0 1 1 0V13.6a.5.5 0 0 1-1 0V8.9Zm-.25-2.16a.75.75 0 1 1 1.5 0 .75.75 0 0 1-1.5 0Z" fill="#0f6cbd" transform="translate(71 687)"/>
    <text x="99" y="702" class="ui small">A reminder is due.</text>
    <path d="m4.09 4.22.06-.07a.5.5 0 0 1 .63-.06l.07.06L10 9.29l5.15-5.14a.5.5 0 0 1 .63-.06l.07.06c.18.17.2.44.06.63l-.06.07L10.71 10l5.14 5.15c.18.17.2.44.06.63l-.06.07a.5.5 0 0 1-.63.06l-.07-.06L10 10.71l-5.15 5.14a.5.5 0 0 1-.63.06l-.07-.06a.5.5 0 0 1-.06-.63l.06-.07L9.29 10 4.15 4.85a.5.5 0 0 1-.06-.63l.06-.07-.06.07Z" fill="#323130" transform="translate(1096 687)"/>

    <rect x="68" y="724" width="160" height="7" rx="3.5" fill="#c8c6c4"/>
    <rect x="400" y="724" width="126" height="7" rx="3.5" fill="#c8c6c4"/>
    <rect x="680" y="724" width="144" height="7" rx="3.5" fill="#c8c6c4"/>
