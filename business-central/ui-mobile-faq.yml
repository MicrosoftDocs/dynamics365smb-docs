title: Mobile Apps FAQ
summary: |
  This article answers questions that our advanced users often ask about the mobile apps for [!INCLUDE [prod_short](includes/prod_short.md)].  
  

sections:
  - name: Ignored
    questions:
      - question: |
          Is there an app for my device?
        answer: |
          Probably! Install the [!INCLUDE[prod_short](includes/prod_short.md)] app on your phone or tablet by downloading the app from the App Store or Google Play.
          
          - [App Store](https://go.microsoft.com/fwlink/?LinkId=734847)
          - [Google Play](https://go.microsoft.com/fwlink/?LinkId=734849)
          
      - question: |
          Is it the same experience in the apps as in the browser?
        answer: |
          No, not exactly. For example, we show only the **Home** activity group due to the limited screen size on mobile devices. Similarly, the keyboard shortcuts are not available because you mainly use touch rather than a keyboard to navigate on mobile devices.
          
          The following table describes some of the most common differences and limitations that you might experience when using [!INCLUDE [prod_short](includes/prod_short.md)] on mobile devices, compared to the browser.
          
          | Concept | On tablets | On phones | Example from the browser |
          |--|--|--|--|
          | Activity groups | Only the **Home** activity group is shown. | Only the **Home** activity group is shown. | **Home** and **Posted Documents** on the `Sales Order Processor` Role Center. |  |
          | Selecting multiple records in lists | Not available. | Not available. | <kbd>Ctrl</kbd>+<kbd>A</kbd> or <kbd>Ctrl</kbd>+<kbd>Click</kbd> on rows in a list in the browser. |
          | Actions in the action bar | Only Promoted actions are shown. | Only Promoted actions are shown. |  |
          | Advanced filters | No column-specific filtering is available. | No column-specific filtering is available. | On the `Customer` list page. |
          | Role Explorer | Not available yet. | Not available yet. | Go to [Finding Pages with the Role Explorer](ui-role-explorer.md). |
          | Fields in FastTabs | Fields in FastTabs on list pages are not shown. Only the repeater control is shown in the content area of the page. | Not available. |  |
          | Select from full list | Not available on lookups. Users are not able to run actions on a lookup page, and they cannot access the full set of records. | Not available on lookups. Users are not able to run actions on a lookup page, and they cannot access the full set of records. | On the `Item Card` when selecting the **Base Units of Measure**. |
          | Search across list columns | Partly supported. Search will not include FlowFields. | Partly supported. Search will not include FlowFields. | Go to examples on the `Customers` list page. |
          | Lookups | Available. | Available, with the difference that advanced and simple lookups behave similarly on the phone. The lookup will not bring up the card, show FactBoxes, or any field groups. | Go to examples on the `Customer Card` page. |
          | Matrix controls | Not available. | Not available. | Go to example in `G/L Budget`. |
          | File download | Available. Cannot download multiple files at the same time. | Available. Cannot download multiple files at the same time. | `Trial Balance` report in the **Print to Excel** check box. |
          | Lists | Available. | Available, with the difference that these are displayed in a brick layout. | Customers or Sales Orders pages. |
          | Indentation in repeater controls | Available. | Not available. The repeater control will be rendered as a regular flat brick layout. | Chart of Accounts and Contacts List pages. |
          | Automatic input focus on first editable field of a page | Not available. | Not available. | `Customer Card` page.<BR /><BR />In the browser, focus will automatically be on the first editable field (such as the `Name` field), enabling you to change the value right away.<BR /><BR />In the tablet and phone apps, this field will not be in focus; instead, you will have to manually select the field first in order to make changes.|
          
      - question: |
          Is it the same experience on tablets and phones?
        answer: |
          Almost, but not quite. Go to the list in the [Is it the same experience in the apps as in the browser?](#is-it-the-same-experience-in-the-apps-as-in-the-browser-) section.  
          
      - question: |
          Can I connect the app to our on-premises solution?
        answer: |
          Yes, you can! It's a slightly different way to signing in, that's all. For more information, go to [Use Business Central on-premises?](install-mobile-app.md#use-business-central-on-premises).

      - question: |
          How do I troubleshoot connection problems in the Business Central mobile app?
        answer: |
          The **Enhanced connectivity** setting helps the Business Central mobile app sign in and connect to Business Central. The setting is turned on by default. Most users don't need to change it.

          ### Why enhanced connectivity was introduced

          The Business Central mobile app is used across many devices, networks, and security configurations. In some environments, network restrictions or device settings can interfere with signing in or connecting.

          Enhanced connectivity gives the mobile app another way to communicate with Business Central. The option to turn it off is available as a troubleshooting measure for the small number of users who experience connection problems while it's enabled.

          For the best experience, leave **Enhanced connectivity** turned on unless you're troubleshooting a connection problem or have been advised to turn it off by your administrator or support representative.

          ### Turn off enhanced connectivity

          If you're having repeated problems signing in or connecting:

          1. Open the Business Central mobile app.
          1. On the sign-in screen, select **Advanced options**.
          1. Expand **Connection troubleshooting**.
          1. Turn off **Enhanced connectivity**.
          1. Wait for the app to reload, and then try to sign in again.

          Turning off **Enhanced connectivity** doesn't delete or modify your Business Central data. It only changes how the mobile app connects to the service on your device. The setting remains off until you turn it back on or reset the app settings.

          If the app shows the message **We couldn't update the enhanced connectivity setting. Try again.**, try to change the setting again.

          ### Restore the recommended setting

          To turn **Enhanced connectivity** back on:

          1. Open **Advanced options**.
          1. Expand **Connection troubleshooting**.
          1. Turn on **Enhanced connectivity**.

          You can also select **Reset app settings** and confirm the action. Resetting app settings turns **Enhanced connectivity** back on, closes the **Connection troubleshooting** section, and restores other app settings to their defaults.

          ### If connection problems continue

          If turning off **Enhanced connectivity** doesn't resolve the problem, turn it back on and contact your administrator or support representative. When requesting help, provide your device type, operating system version, Business Central mobile app version, and any error message displayed during sign-in.

      - question: |
          Can a guest or external user use the app to access our Business Central solution?
        answer: |
          No. Guest users are invited users from a different Microsoft Entra tenant than yours. In this case, the app will authenticate to the guest user's primary Microsoft Entra tenant and try to open the Business Central endpoint on that tenant instead of yours. External users, even those who are members, can't use the app to access Business Central. 

